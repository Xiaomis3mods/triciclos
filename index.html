<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Triciclos L&L Pro</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
:root{--r:#E63946;--bg:#F3F6FA;--card:#fff;--text:#1F2937;--border:#E5E7EB}
body{background:var(--bg);color:var(--text)}

header img{
width:100%;height:240px;object-fit:cover;
border-bottom-left-radius:28px;border-bottom-right-radius:28px;
}

.slogan{
background:#fff;padding:14px;text-align:center;font-weight:700;
border-bottom:1px solid var(--border);
}

.container{max-width:820px;margin:auto;padding:14px}

.card{
background:#fff;padding:18px;border-radius:18px;margin:14px 0;
border:1px solid var(--border);
box-shadow:0 6px 18px rgba(0,0,0,.06)
}

h2{margin-bottom:10px}

.map-tab,button{
width:100%;padding:14px;border:none;border-radius:14px;
background:var(--r);color:#fff;font-weight:700;cursor:pointer
}

#mapContainer,#serviciosContainer{display:none}

#map{height:55vh;min-height:320px;border-radius:16px}

.service-item{
margin-bottom:18px;
padding-bottom:12px;
border-bottom:1px solid #eee;
}

.service-item:last-child{
border-bottom:none;
margin-bottom:0;
padding-bottom:0;
}

.service-title{
font-weight:700;
margin-bottom:6px;
}

.btn2{
display:block;text-align:center;padding:14px;
border-radius:14px;background:#fff;
border:1px solid #D1D5DB;color:#111827;
margin-top:10px;text-decoration:none
}

/* inputs reserva */
input,select,textarea{
width:100%;
padding:12px;
margin:6px 0;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

textarea{resize:none;height:80px}
</style>
</head>

<body>

<header>
<img src="https://raw.githubusercontent.com/Xiaomis3mods/triciclos/c220dab7d5dc484192a8defa395218563e72c7d9/6%20sin%20t%C3%ADtulo_20260702083634.jpg">
</header>

<div class="slogan">Tu destino, nuestro compromiso</div>

<div class="container">

<div class="card">
<h2>Ubicación</h2>
<button class="map-tab" onclick="toggleMap()">🗺 Abrir Mapa</button>
<div id="mapContainer"><div id="map"></div></div>
</div>

<button class="map-tab" onclick="toggleServicios()">📋 Nuestros Servicios</button>

<div id="serviciosContainer">
<div class="card">
<h2>Servicios disponibles</h2>

<div class="service-item">
<div class="service-title">🚖 Transportación de pasajeros</div>
<div>Traslados seguros y rápidos.</div>
</div>

<div class="service-item">
<div class="service-title">📦 Transportación de cargas</div>
<div>Entrega de paquetes y mercancías.</div>
</div>

<div class="service-item">
<div class="service-title">🛠 Remolque de vehículos eléctricos</div>
<div>Asistencia en carretera.</div>
</div>

</div>
</div>

<div class="card">
<h2>Reserva tu viaje</h2>

<input id="nombre" placeholder="Nombre completo" required>
<input id="tel" placeholder="Teléfono" required>
<input id="origen" placeholder="Lugar de recogida" required>
<input id="destino" placeholder="Destino" required>

<select id="pas" required>
<option value="" disabled selected>Cantidad de pasajeros</option>
<option value="1">1 pasajero</option>
<option value="2">2 pasajeros</option>
<option value="3">3 pasajeros</option>
<option value="4">4 pasajeros</option>
<option value="5">5 pasajeros</option>
<option value="6">6 pasajeros</option>
</select>

<select id="pago" required>
<option value="" disabled selected>Método de pago</option>
<option value="Efectivo">Efectivo</option>
<option value="Transferencia">Transferencia</option>
</select>

<textarea id="obs" placeholder="Observaciones (opcional)"></textarea>

<button onclick="enviar()">📲 Reservar por WhatsApp</button>

<a class="btn2" href="https://raw.githubusercontent.com/Xiaomis3mods/triciclos/main/Triciclos%20L%26L.apk">
⬇️ Descargar App
</a>

</div>

</div>

<script>
const mc=document.getElementById("mapContainer");

let map=L.map('map').setView([23.1136,-82.3666],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

function toggleMap(){
if(mc.style.display=="block"){
mc.style.display="none";
document.querySelector('.map-tab').textContent="🗺 Abrir Mapa";
}else{
mc.style.display="block";
document.querySelector('.map-tab').textContent="✖️ Cerrar Mapa";
setTimeout(()=>map.invalidateSize(),200);
}
}

function toggleServicios(){
const b=document.getElementById("serviciosContainer");
const btn=document.querySelectorAll('.map-tab')[1];

if(b.style.display=="block"){
b.style.display="none";
btn.textContent="📋 Nuestros Servicios";
}else{
b.style.display="block";
btn.textContent="✖️ Cerrar";
}
}

function enviar(){
const n=document.getElementById("nombre").value;
const t=document.getElementById("tel").value;
const o=document.getElementById("origen").value;
const d=document.getElementById("destino").value;
const p=document.getElementById("pas").value;
const pg=document.getElementById("pago").value;
const ob=document.getElementById("obs").value;

if(!n||!t||!o||!d||!p||!pg){
alert("Completa todos los campos");
return;
}

let m=encodeURIComponent(`🚖 NUEVA RESERVA

👤 ${n}
📞 ${t}
📍 ${o}
🏁 ${d}
👥 ${p}
💳 ${pg}
📝 ${ob}`);

window.open("https://wa.me/5354632153?text="+m);
}
</script>

</body>
</html>
