<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Dirección Híbrido con Mapa Real</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 600;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
        }

        .map-icon-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
        }

        button.btn-submit {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-submit:hover {
            background-color: #2563eb;
        }

        /* --- ESTILOS DE LOS MODALES --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        @media (min-width: 500px) {
            .modal-overlay {
                align-items: center;
            }
            .modal-content {
                border-radius: 12px;
            }
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #1e293b;
        }

        .option-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 14px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            font-weight: 500;
            color: #334155;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #1d4ed8;
        }

        .option-btn span {
            margin-right: 12px;
            font-size: 20px;
        }

        .close-modal {
            width: 100%;
            background: transparent;
            border: none;
            color: #64748b;
            padding: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        /* --- CONTENEDOR DEL MAPA REAL --- */
        #map {
            width: 100%;
            height: 300px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
        }

        .btn-confirm-map {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Datos de Envío</h2>
        
        <div class="input-group">
            <label for="direccion">Dirección de entrega</label>
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="direccion" 
                    placeholder="Toca para añadir tu dirección..." 
                    readonly
                >
                <button type="button" class="map-icon-btn" id="mapIconBtn" title="Seleccionar en mapa">📍</button>
            </div>
        </div>

        <button class="btn-submit">Confirmar Pedido</button>
    </div>

    <div class="modal-overlay" id="modalOpciones">
        <div class="modal-content">
            <div class="modal-title">¿Cómo deseas añadir tu dirección?</div>
            
            <button class="option-btn" id="btnOpcionMapa">
                <span>🗺️</span> Seleccionar ubicación en el mapa
            </button>
            
            <button class="option-btn" id="btnOpcionManual">
                <span>✍️</span> Escribir dirección manualmente
            </button>

            <button class="close-modal" id="btnCerrarOpciones">Cancelar</button>
        </div>
    </div>

    <div class="modal-overlay" id="modalMapa">
        <div class="modal-content" style="max-width: 550px;">
            <div class="modal-title">Mueve el mapa para situar el pin 📍</div>
            
            <div id="map"></div>
            
            <button class="btn-confirm-map" id="btnConfirmarUbicacion">Confirmar esta ubicación</button>
            <button class="close-modal" id="btnCerrarMapa">Atrás</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const inputDireccion = document.getElementById('direccion');
        const mapIconBtn = document.getElementById('mapIconBtn');
        
        const modalOpciones = document.getElementById('modalOpciones');
        const btnCerrarOpciones = document.getElementById('btnCerrarOpciones');
        const btnOpcionMapa = document.getElementById('btnOpcionMapa');
        const btnOpcionManual = document.getElementById('btnOpcionManual');

        const modalMapa = document.getElementById('modalMapa');
        const btnCerrarMapa = document.getElementById('btnCerrarMapa');
        const btnConfirmarUbicacion = document.getElementById('btnConfirmarUbicacion');

        let map;
        let marker;
        // Coordenadas por defecto (Madrid, España como ejemplo inicial)
        let latActual = 40.416775;
        let lonActual = -3.703790;

        // Abrir y cerrar modales
        function toggleModal(modal, abrir) {
            if (abrir) modal.classList.add('active');
            else modal.classList.remove('active');
        }

        // Eventos de apertura inicial
        inputDireccion.addEventListener('click', () => {
            if (inputDireccion.hasAttribute('readonly')) toggleModal(modalOpciones, true);
        });

        mapIconBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleModal(modalOpciones, true);
        });

        btnCerrarOpciones.addEventListener('click', () => toggleModal(modalOpciones, false));
        btnCerrarMapa.addEventListener('click', () => toggleModal(modalMapa, false));

        // Opción: Escribir a mano directamente
        btnOpcionManual.addEventListener('click', () => {
            toggleModal(modalOpciones, false);
            activarInputEdicion();
        });

        // Opción: Abrir el mapa interactivo
        btnOpcionMapa.addEventListener('click', () => {
            toggleModal(modalOpciones, false);
            toggleModal(modalMapa, true);
            
            // Intentar obtener la ubicación real del usuario mediante el GPS del navegador
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    latActual = position.coords.latitude;
                    lonActual = position.coords.longitude;
                    inicializarMapa(latActual, lonActual);
                }, () => {
                    // Si el usuario deniega el GPS, carga las coordenadas por defecto
                    inicializarMapa(latActual, lonActual);
                });
            } else {
                inicializarMapa(latActual, lonActual);
            }
        });

        // Inicializar o refrescar el mapa de OpenStreetMap
        function inicializarMapa(lat, lon) {
            // Esperar un instante para que el modal se despliegue y Leaflet calcule bien el tamaño
            setTimeout(() => {
                if (!map) {
                    map = L.map('map').setView([lat, lon], 16);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(map);

                    // Pin en el centro
                    marker = L.marker([lat, lon], { draggable: false }).addTo(map);

                    // Cada vez que el mapa se mueva, el pin se queda fijo en el centro visual
                    map.on('move', () => {
                        const centro = map.getCenter();
                        marker.setLatLng(centro);
                    });
                } else {
                    map.setView([lat, lon], 16);
                    marker.setLatLng([lat, lon]);
                    map.invalidateSize(); // Corrige errores visuales de renderizado en modales ocultos
                }
            }, 200);
        }

        // Al confirmar ubicación en el mapa, obtener nombre de calle real (Geocoding inverso gratuito)
        btnConfirmarUbicacion.addEventListener('click', async () => {
            const centro = map.getCenter();
            btnConfirmarUbicacion.innerText = "Obteniendo dirección...";
            btnConfirmarUbicacion.disabled = true;

            try {
                // Consultamos la API pública de Nominatim (OpenStreetMap) para traducir coordenadas a texto
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${centro.lat}&lon=${centro.lng}&zoom=18&addressdetails=1`);
                const data = await response.json();
                
                if (data && data.display_name) {
                    // Limpiamos un poco el texto largo que devuelve para que entre en el formulario
                    const partes = data.display_name.split(',');
                    const direccionCorta = partes.slice(0, 3).join(',').trim();
                    
                    inputDireccion.value = direccionCorta;
                } else {
                    inputDireccion.value = `Lat: ${centro.lat.toFixed(5)}, Lon: ${centro.lng.toFixed(5)}`;
                }
            } catch (error) {
                inputDireccion.value = `Lat: ${centro.lat.toFixed(5)}, Lon: ${centro.lng.toFixed(5)}`;
            } finally {
                btnConfirmarUbicacion.innerText = "Confirmar esta ubicación";
                btnConfirmarUbicacion.disabled = false;
                toggleModal(modalMapa, false);
                activarInputEdicion();
            }
        });

        // Quita el bloqueo de solo lectura y enfoca el teclado
        function activarInputEdicion() {
            inputDireccion.removeAttribute('readonly');
            inputDireccion.focus();
        }
    </script>
</body>
</html>
