<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Dirección Híbrido</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 600;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #3b82f6;
        }

        /* Icono del mapa dentro del input */
        .map-icon-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3b82f6;
        }

        button.btn-submit {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-submit:hover {
            background-color: #2563eb;
        }

        /* --- ESTILOS DEL MODAL (MENÚ DE OPCIONES) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: flex-end; /* En móviles sube desde abajo */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        @media (min-width: 500px) {
            .modal-overlay {
                align-items: center; /* En escritorio se centra */
            }
            .modal-content {
                border-radius: 12px;
            }
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #1e293b;
        }

        .option-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 14px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            font-weight: 500;
            color: #334155;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #1d4ed8;
        }

        .option-btn span {
            margin-right: 12px;
            font-size: 20px;
        }

        .close-modal {
            width: 100%;
            background: transparent;
            border: none;
            color: #64748b;
            padding: 8px;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Datos de Envío</h2>
        
        <div class="input-group">
            <label for="direccion">Dirección de entrega</label>
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="direccion" 
                    placeholder="Toca para añadir tu dirección..." 
                    readonly
                >
                <!-- Botón de mapa integrado -->
                <button type="button" class="map-icon-btn" id="mapIconBtn" title="Seleccionar en mapa">📍</button>
            </div>
        </div>

        <button class="btn-submit">Confirmar Pedido</button>
    </div>

    <!-- MODAL DE OPCIONES -->
    <div class="modal-overlay" id="modalOpciones">
        <div class="modal-content">
            <div class="modal-title">¿Cómo deseas añadir tu dirección?</div>
            
            <button class="option-btn" id="btnOpcionMapa">
                <span>🗺️</span> Seleccionar ubicación en el mapa
            </button>
            
            <button class="option-btn" id="btnOpcionManual">
                <span>✍️</span> Escribir dirección manualmente
            </button>

            <button class="close-modal" id="btnCerrarModal">Cancelar</button>
        </div>
    </div>

    <script>
        const inputDireccion = document.getElementById('direccion');
        const mapIconBtn = document.getElementById('mapIconBtn');
        const modal = document.getElementById('modalOpciones');
        const btnCerrarModal = document.getElementById('btnCerrarModal');
        const btnOpcionMapa = document.getElementById('btnOpcionMapa');
        const btnOpcionManual = document.getElementById('btnOpcionManual');

        // Función para abrir el modal
        function abrirModal() {
            modal.classList.add('active');
        }

        // Función para cerrar el modal
        function cerrarModal() {
            modal.classList.remove('active');
        }

        // Al tocar el input (si está vacío) o el icono del mapa, abrimos las opciones
        inputDireccion.addEventListener('click', () => {
            if (inputDireccion.hasAttribute('readonly')) {
                abrirModal();
            }
        });

        mapIconBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Evita conflictos de clicks
            abrirModal();
        });

        btnCerrarModal.addEventListener('click', cerrarModal);

        // OPCIÓN 1: Selección en Mapa (Simulación)
        btnOpcionMapa.addEventListener('click', () => {
            cerrarModal();
            alert("Aquí se abriría tu mapa (Google Maps / Leaflet). Simulemos que el usuario movió el pin y seleccionó una ubicación.");
            
            // Inyectamos la dirección obtenida del mapa
            inputDireccion.value = "Av. de la Constitución 145, Piso 3B";
            
            // ¡LA CLAVE! Hacemos que el campo sea editable a mano por si quiere corregir algo
            inputDireccion.removeAttribute('readonly');
            inputDireccion.focus();
        });

        // OPCIÓN 2: Escribir a mano directamente
        btnOpcionManual.addEventListener('click', () => {
            cerrarModal();
            // Quitamos el bloqueado para que pueda escribir
            inputDireccion.removeAttribute('readonly');
            inputDireccion.focus();
        });
    </script>

</body>
</html>
